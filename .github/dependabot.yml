version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      eslint:
        patterns: ["*eslint*"]
      jest:
        patterns: ["*jest*"]
      material-ui:
        patterns: ["@mui/*"]
      react:
        patterns: ["react", "react-dom"]
      rsbuild:
        patterns: ["@rsbuild/*"]
